<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="ti de">
<title id="ti">Orbit architecture</title>
<desc id="de">The browser UI talks to a local HTTP server on 127.0.0.1. The server hands each chat request to the orchestrator, which runs a classifier, a router, a provider gateway, a quality gate and an escalation policy. The orchestrator uses read-only memory, permission-gated integrations, local storage and Claude Code workers. Voice engines are attached to the server.</desc>
<style>.t{font:600 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#e6edf3} .s{font:12.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#9da7b3} .l{font:600 12.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#a371f7;letter-spacing:.3px} .n{font:italic 12.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#9da7b3} .ar{stroke:#9da7b3;fill:none}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#9da7b3"/></marker></defs>
<rect x="0.75" y="0.75" width="998.5" height="538.5" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<rect x="40" y="30" width="250" height="74" rx="10" fill="#0d2847" stroke="#388bfd" stroke-width="1.5"/><text x="165.0" y="56" text-anchor="middle" class="t">Browser UI</text><text x="165.0" y="78" text-anchor="middle" class="s">Three.js core, chat,</text><text x="165.0" y="95" text-anchor="middle" class="s">history, diagnostics</text>
<rect x="375" y="30" width="250" height="74" rx="10" fill="#0d2847" stroke="#388bfd" stroke-width="1.5"/><text x="500.0" y="56" text-anchor="middle" class="t">Local HTTP server</text><text x="500.0" y="78" text-anchor="middle" class="s">127.0.0.1 only, CSP,</text><text x="500.0" y="95" text-anchor="middle" class="s">live events over SSE</text>
<rect x="710" y="30" width="250" height="74" rx="10" fill="#0d2847" stroke="#388bfd" stroke-width="1.5"/><text x="835.0" y="56" text-anchor="middle" class="t">Voice engines</text><text x="835.0" y="78" text-anchor="middle" class="s">Whisper, Vosk,</text><text x="835.0" y="95" text-anchor="middle" class="s">Piper, ElevenLabs</text>
<line x1="292" y1="67" x2="373" y2="67" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)" class="ar"/>
<line x1="627" y1="67" x2="708" y2="67" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)" class="ar"/>
<line x1="500" y1="106" x2="500" y2="138" stroke-width="1.6" marker-end="url(#a)" class="ar"/>
<rect x="40" y="140" width="920" height="214" rx="12" fill="none" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="60" y="165" class="l">ORCHESTRATOR: ONE REQUEST, ONE PIPELINE</text>
<rect x="65" y="182" width="150" height="90" rx="10" fill="#2a1b45" stroke="#8957e5" stroke-width="1.5"/><text x="140.0" y="208" text-anchor="middle" class="t">Classifier</text><text x="140.0" y="230" text-anchor="middle" class="s">rules in code,</text><text x="140.0" y="247" text-anchor="middle" class="s">no model call</text>
<rect x="245" y="182" width="150" height="90" rx="10" fill="#2a1b45" stroke="#8957e5" stroke-width="1.5"/><text x="320.0" y="208" text-anchor="middle" class="t">Router</text><text x="320.0" y="230" text-anchor="middle" class="s">tier, budget,</text><text x="320.0" y="247" text-anchor="middle" class="s">verification plan</text>
<rect x="425" y="182" width="150" height="90" rx="10" fill="#2a1b45" stroke="#8957e5" stroke-width="1.5"/><text x="500.0" y="208" text-anchor="middle" class="t">Provider gateway</text><text x="500.0" y="230" text-anchor="middle" class="s">limits, retry,</text><text x="500.0" y="247" text-anchor="middle" class="s">usage tracking</text>
<rect x="605" y="182" width="150" height="90" rx="10" fill="#2a1b45" stroke="#8957e5" stroke-width="1.5"/><text x="680.0" y="208" text-anchor="middle" class="t">Quality Gate</text><text x="680.0" y="230" text-anchor="middle" class="s">local checks, then</text><text x="680.0" y="247" text-anchor="middle" class="s">separate AI verifier</text>
<rect x="785" y="182" width="150" height="90" rx="10" fill="#2a1b45" stroke="#8957e5" stroke-width="1.5"/><text x="860.0" y="208" text-anchor="middle" class="t">Escalation policy</text><text x="860.0" y="230" text-anchor="middle" class="s">retry, or move up</text><text x="860.0" y="247" text-anchor="middle" class="s">a model tier</text>
<line x1="217" y1="227" x2="243" y2="227" stroke-width="1.6" marker-end="url(#a)" class="ar"/>
<line x1="397" y1="227" x2="423" y2="227" stroke-width="1.6" marker-end="url(#a)" class="ar"/>
<line x1="577" y1="227" x2="603" y2="227" stroke-width="1.6" marker-end="url(#a)" class="ar"/>
<line x1="757" y1="227" x2="783" y2="227" stroke-width="1.6" marker-end="url(#a)" class="ar"/>
<path d="M860 274 V312 H500 V276" stroke-width="1.6" marker-end="url(#a)" class="ar"/>
<text x="680.0" y="333" text-anchor="middle" class="n">verdict FAIL: try again, or escalate</text>
<rect x="40" y="410" width="205" height="100" rx="10" fill="#0f2e1a" stroke="#2ea043" stroke-width="1.5"/><text x="142.5" y="436" text-anchor="middle" class="t">Memory</text><text x="142.5" y="458" text-anchor="middle" class="s">section-level search,</text><text x="142.5" y="475" text-anchor="middle" class="s">SQLite FTS5 index,</text><text x="142.5" y="492" text-anchor="middle" class="s">vault is read-only</text>
<rect x="278" y="410" width="205" height="100" rx="10" fill="#0f2e1a" stroke="#2ea043" stroke-width="1.5"/><text x="380.5" y="436" text-anchor="middle" class="t">Integrations</text><text x="380.5" y="458" text-anchor="middle" class="s">every action goes through</text><text x="380.5" y="475" text-anchor="middle" class="s">the Permission Manager</text><text x="380.5" y="492" text-anchor="middle" class="s">and an audit log</text>
<rect x="516" y="410" width="205" height="100" rx="10" fill="#0f2e1a" stroke="#2ea043" stroke-width="1.5"/><text x="618.5" y="436" text-anchor="middle" class="t">Storage</text><text x="618.5" y="458" text-anchor="middle" class="s">chat history, usage,</text><text x="618.5" y="475" text-anchor="middle" class="s">audit log (SQLite),</text><text x="618.5" y="492" text-anchor="middle" class="s">outside the vault</text>
<rect x="754" y="410" width="205" height="100" rx="10" fill="#3a2b05" stroke="#d29922" stroke-width="1.5"/><text x="856.5" y="436" text-anchor="middle" class="t">Claude Code</text><text x="856.5" y="458" text-anchor="middle" class="s">claude -p workers,</text><text x="856.5" y="475" text-anchor="middle" class="s">subscription login,</text><text x="856.5" y="492" text-anchor="middle" class="s">no API key</text>
<line x1="142.5" y1="356" x2="142.5" y2="408" stroke-width="1.6" marker-end="url(#a)" class="ar"/>
<line x1="380.5" y1="356" x2="380.5" y2="408" stroke-width="1.6" marker-end="url(#a)" class="ar"/>
<line x1="618.5" y1="356" x2="618.5" y2="408" stroke-width="1.6" marker-end="url(#a)" class="ar"/>
<line x1="856.5" y1="356" x2="856.5" y2="408" stroke-width="1.6" marker-end="url(#a)" class="ar"/>
</svg>